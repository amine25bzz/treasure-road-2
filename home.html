<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Treasure Road</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&family=Rajdhani:wght@600;700&display=swap">
<link rel="stylesheet" href="home.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 2.5 1.5 12H5v9h5.5v-6h3v6H19v-9h3.5z"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4.5"/><path d="M3.5 21c0-5 3.8-8 8.5-8s8.5 3 8.5 8z"/></symbol>
    <symbol id="i-pack" viewBox="0 0 24 24"><path d="M9 2h6l1 3h1a3 3 0 0 1 3 3v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a3 3 0 0 1 3-3h1zM8 13h8v3H8z" fill-rule="evenodd"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-dasharray="2.33 2.33"/><path fill-rule="evenodd" d="M12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M6 3h12v5a6 6 0 0 1-12 0zM10.5 14h3v3h3v3h-9v-3h3z"/><path d="M6 5H2.5v2a4 4 0 0 0 4 4M18 5h3.5v2a4 4 0 0 1-4 4" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M11 2h2v10h-2z"/><path d="M7 5.2a8 8 0 1 0 10 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2 3h3l3 11h10.5l2-8H6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="9.5" cy="19" r="1.8"/><circle cx="17" cy="19" r="1.8"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3 6.9 7.5.7-5.7 5 1.8 7.4L12 18l-6.6 4 1.8-7.4-5.7-5 7.5-.7z"/></symbol>
    <symbol id="i-medal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m12 6.5 1.7 3.8 4.1.4-3.1 2.7.9 4-3.6-2.1-3.6 2.1.9-4-3.1-2.7 4.1-.4z"/></symbol>
    <symbol id="i-skull" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a8 8 0 0 0-8 8c0 3 1.5 4.7 3 5.7V20h2v-2h2v2h2v-2h2v2h2v-4.3c1.5-1 3-2.7 3-5.7a8 8 0 0 0-8-8zM8.5 9a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="m3 19-1-12 5.2 4.2L12 4l4.8 7.2L22 7l-1 12z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m3 6.5 9 6.5 9-6.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.8"/><path d="M1.5 20c0-4.4 3.2-6.8 7.5-6.8s7.5 2.4 7.5 6.8z"/><circle cx="17.5" cy="8.5" r="3" opacity=".75"/><path d="M17.5 13.6c3 .2 5 2.2 5 6.4h-4.2c0-2.6-.6-4.6-.8-6.4z" opacity=".75"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3 3.5h18v14H9.5L5 21.5v-4H3zM7 8v1.8h10V8zm0 4v1.8h7V12z"/></symbol>
    <symbol id="i-bars" viewBox="0 0 24 24"><rect x="3" y="14" width="4.5" height="7"/><rect x="9.8" y="9" width="4.5" height="12"/><rect x="16.5" y="3" width="4.5" height="18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M10.5 4h3v6.5H20v3h-6.5V20h-3v-6.5H4v-3h6.5z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M5 3.5 21 12 5 20.5z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m8.5 4.5 7.5 7.5-7.5 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="home">
  <div id="stage">
    <div class="bgimg"></div>
    <div class="vig"></div>

    <!-- الشعار -->
    <img class="logo" src="images/ui/logo.png" alt="Treasure Road" draggable="false">

    <!-- القائمة اليسرى -->
    <nav class="menu" id="menu">
      <button class="mi gold on" type="button" data-act="home"><svg class="i"><use href="#i-home"/></svg><span>HOME</span><svg class="ch"><use href="#i-chev"/></svg></button>
      <button class="mi blue" type="button" data-act="character"><svg class="i"><use href="#i-person"/></svg><span>CHARACTER</span><svg class="ch"><use href="#i-chev"/></svg></button>
      <button class="mi purple" type="button" data-act="loadout"><svg class="i"><use href="#i-pack"/></svg><span>LOADOUT</span><svg class="ch"><use href="#i-chev"/></svg></button>
      <button class="mi gray" type="button" data-act="settings"><svg class="i"><use href="#i-gear"/></svg><span>SETTINGS</span><svg class="ch"><use href="#i-chev"/></svg></button>
      <button class="mi gold2" type="button" data-act="achievements"><svg class="i"><use href="#i-trophy"/></svg><span>ACHIEVEMENTS</span><svg class="ch"><use href="#i-chev"/></svg></button>
      <button class="mi red" type="button" data-act="exit"><svg class="i"><use href="#i-power"/></svg><span>EXIT</span><svg class="ch"><use href="#i-chev"/></svg></button>
    </nav>

    <!-- العملات + الأيقونات العلوية -->
    <div class="pill coins" id="coinPill"><i class="coin"></i><b id="coinN">1000</b><button class="addb" id="coinBtn" type="button" aria-label="Store"><svg><use href="#i-plus"/></svg></button></div>
    <div class="pill gems"><i class="gem"></i><b id="gemN">50</b><button class="addb" id="gemBtn" type="button" aria-label="Gems"><svg><use href="#i-plus"/></svg></button></div>
    <!-- البطل -->
    <section class="hero" id="heroBox"><img id="hImg" class="himg" alt="" draggable="false"></section>

    <!-- الصعوبة + اللعب + المتجر -->
    <section class="diff">
      <div class="dh"><svg><use href="#i-bars"/></svg><span>DIFFICULTY</span></div>
      <div class="diffs" id="diffs">
        <button class="chip" type="button" data-d="0"><svg><use href="#i-star"/></svg><span>EASY</span></button>
        <button class="chip on" type="button" data-d="1"><svg><use href="#i-medal"/></svg><span>NORMAL</span></button>
        <button class="chip" type="button" data-d="2"><svg><use href="#i-skull"/></svg><span>HARD</span></button>
        <button class="chip locked" type="button" data-d="3"><svg><use href="#i-crown"/></svg><span>EXPERT</span></button>
      </div>
    </section>

    <button class="shop" id="shopBtn" type="button"><svg><use href="#i-cart"/></svg><span>STORE</span><svg class="ch"><use href="#i-chev"/></svg></button>

    <!-- اختيار الشخصية -->
    <div class="rosterwrap">
      <button class="arr" id="prevH" type="button" aria-label="Previous"><svg style="transform:scaleX(-1)"><use href="#i-chev"/></svg></button>
      <footer class="roster" id="cards">
        <button class="card sel" type="button" data-side="0"><img src="images/heroes/player1h/face-player1h.png" alt="JACK"><div class="nm">JACK</div></button>
        <button class="card" type="button" data-side="1"><img src="images/heroes/player2h/face-player2h.png" alt="REX"><div class="nm">REX</div></button>
        <button class="card" type="button" data-side="2"><img src="images/heroes/player3h/face-player3h.png" alt="MINA"><div class="nm">MINA</div></button>
        <button class="card" type="button" data-side="3"><img src="images/heroes/player4h/face-player4h.png" alt="MAX"><div class="nm">MAX</div></button>
      </footer>
      <button class="arr" id="nextH" type="button" aria-label="Next"><svg><use href="#i-chev"/></svg></button>
    </div>

    <!-- الشريط السفلي -->
    <div class="bottombar"></div>
    <div class="hexes">
      <button class="hex" type="button" data-act="settings"><svg><use href="#i-gear"/></svg></button>
      <button class="hex" type="button" data-act="friends"><svg><use href="#i-users"/></svg></button>
      <button class="hex" type="button" data-act="chat"><svg><use href="#i-chat"/></svg><em>1</em></button>
    </div>
    <div class="ad" id="adBanner"><b>AD BANNER</b><small>(YOUR AD HERE)</small></div>
    <button class="play2" id="startBtn2" type="button"><svg><use href="#i-play"/></svg><span>PLAY</span></button>
  </div>
</div>

<!-- نافذة العتاد -->
<div id="loadoutModal" class="modal" hidden>
  <div class="sheet small">
    <div class="sh-head"><h2>LOADOUT</h2><button class="x" id="loClose" type="button">&times;</button></div>
    <div class="loadout" id="loadout"></div>
  </div>
</div>

<div id="store" hidden>
  <div class="sheet">
    <div class="sh-head">
      <h2>STORE</h2>
      <div class="sh-coins"><i class="coin"></i><b id="stCoins">1000</b></div>
      <button class="x" id="stClose" type="button">&times;</button>
    </div>
    <div class="items" id="items"></div>
    <div class="sh-foot">Earn coins in battle: +8 per kill, +250 for winning. Selling refunds the full price.</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/sprites-home.js"></script>
<script src="Home.js"></script>
</body>
</html>
